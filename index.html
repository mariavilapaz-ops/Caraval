<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#100d16">
  <title>Caraval — Juego interactivo</title>
  <style>
    :root {
      color-scheme: dark;
      --app-bg: #100d16;
      --fade-ms: 950ms;
      --visual-height: 100dvh;
    }

    * { box-sizing: border-box; }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--app-bg);
    }

    body {
      position: fixed;
      inset: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #game-shell {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: var(--layout-height, 100dvh);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--app-bg);
      padding: 0;
    }

    /* El escenario ocupa todo el viewport; el SVG conserva su proporción
       mediante preserveAspectRatio y el fondo extendido rellena los laterales. */
    #ambient-backdrop {
      position: fixed;
      inset: -28px;
      z-index: 0;
      background-color: var(--app-bg);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: blur(26px) saturate(1.08);
      transform: scale(1.06);
      opacity: .72;
      pointer-events: none;
      will-change: background-image;
    }

    #stage {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100%;
      max-width: none;
      max-height: none;
      aspect-ratio: auto;
      flex: 1 1 auto;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    #stage > svg {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      /* No se aplican resets gráficos a los elementos internos del SVG. */
      transition: opacity var(--fade-ms) cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 1;
    }

    #stage > svg.is-active {
      display: block;
      z-index: 10;
      pointer-events: auto;
    }

    #stage > svg.is-entering { opacity: 0; }
    #stage > svg.is-leaving {
      opacity: 0;
      pointer-events: none !important;
      z-index: 9 !important;
    }

    /* Las imágenes incrustadas son arte de fondo, nunca controles. */
    #stage > svg image,
    #stage > svg [data-background="true"] {
      pointer-events: none !important;
    }

    #stage > svg.is-active * {
      /* No se fuerza pointer-events globalmente: solo sobre controles detectados. */
    }

    .game-hit-target {
      cursor: pointer !important;
      touch-action: manipulation;
    }

    #answer-input {
      position: absolute;
      z-index: 20;
      display: none;
      margin: 0;
      padding: 0;
      min-width: 0;
      max-width: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      box-shadow: none;
      background: transparent;
      color: #24172a;
      caret-color: #24172a;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      line-height: 1;
      font-size: 16px;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      translate: 0px 0px;
      transition: translate 240ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: translate;
    }

    #answer-input:focus {
      background: transparent;
      box-shadow: none;
      outline: none;
      transform: none;
    }


    #status-message {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: min(92vw, 420px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(20, 15, 27, .88);
      color: #fff;
      font: 500 13px/1.35 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #status-message.visible { opacity: 1; }

    #error-panel {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #100d16;
      color: #fff;
      text-align: center;
    }

    #error-panel.visible { display: flex; }

    #error-panel section {
      width: min(100%, 520px);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    #error-panel h1 {
      margin: 0 0 12px;
      font: 600 22px/1.2 Georgia, serif;
    }

    #error-panel p {
      margin: 10px 0;
      color: rgba(255,255,255,.82);
      font: 14px/1.55 system-ui, sans-serif;
    }

    #error-panel code {
      color: #f1d8aa;
      overflow-wrap: anywhere;
    }

    #retry-button {
      margin-top: 12px;
      padding: 11px 18px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: transparent;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .shake {
      animation: gentle-shake 360ms ease-in-out;
    }

    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-5px); }
      36% { transform: translateX(5px); }
      54% { transform: translateX(-3px); }
      72% { transform: translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #stage > svg, #status-message { transition-duration: 1ms; }
      .shake { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Juego interactivo">
    <div id="ambient-backdrop" aria-hidden="true"></div>
    <div id="stage" aria-live="off"></div>
    <input
      id="answer-input"
      type="text"
      inputmode="text"
      enterkeyhint="done"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      maxlength="12"
      aria-label="Escribe la letra de la pista"
    >
  </main>

  <div id="status-message" role="status" aria-live="polite"></div>

  <div id="error-panel" role="alert">
    <section>
      <h1>No se pudieron cargar las pantallas</h1>
      <p id="error-description"></p>
      <p>Comprueba que <code>index.html</code> y los archivos <code>Pantalla_1.svg</code> a <code>Pantalla_14.svg</code> estén en la misma carpeta y abre el juego desde un servidor local.</p>
      <p>Por ejemplo, en esa carpeta ejecuta <code>python3 -m http.server 8000</code> y visita <code>http://localhost:8000</code>.</p>
      <button id="retry-button" type="button">Volver a intentar</button>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const TOTAL_SCREENS = 14;
    const FADE_MS = 320;
    const AUTO_ADVANCE = new Map([
      [1, 2000],
      [2, 2000],
      [11, 3000],
      [12, 7000]
    ]);
    const EXPECTED_LETTERS = new Map([
      [5, "L"],
      [6, "E"],
      [7, "G"],
      [8, "E"],
      [9, "N"],
      [10, "D"]
    ]);

    const stage = document.getElementById("stage");
    const shell = document.getElementById("game-shell");
    const ambientBackdrop = document.getElementById("ambient-backdrop");
    const answerInput = document.getElementById("answer-input");
    const statusMessage = document.getElementById("status-message");
    const errorPanel = document.getElementById("error-panel");
    const errorDescription = document.getElementById("error-description");
    const retryButton = document.getElementById("retry-button");

    const svgTextCache = new Map();
    let currentScreen = 0;
    let autoTimer = null;
    let statusTimer = null;
    let inputPositionFrame = 0;
    let lastPointerAction = 0;
    let navigationLock = false;
    let activeSvg = null;
    let backdropObjectUrl = null;
    let keyboardControlLayers = [];
    let keyboardShiftY = 0;

    // Fija la altura del escenario al viewport de layout, no al viewport reducido por el teclado.
    document.documentElement.style.setProperty("--layout-height", `${window.innerHeight}px`);

    function lockDocumentScroll() {
      if (window.scrollX !== 0 || window.scrollY !== 0) {
        window.scrollTo(0, 0);
      }
      document.documentElement.scrollTop = 0;
      document.documentElement.scrollLeft = 0;
      document.body.scrollTop = 0;
      document.body.scrollLeft = 0;
    }

    function fileName(number) {
      return `Pantalla_${number}.svg`;
    }

    function showError(message) {
      errorDescription.textContent = message;
      errorPanel.classList.add("visible");
    }

    function hideError() {
      errorPanel.classList.remove("visible");
    }

    function showStatus(message, duration = 1400) {
      statusMessage.textContent = message;
      statusMessage.classList.add("visible");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => statusMessage.classList.remove("visible"), duration);
    }

    /*
     * Illustrator suele codificar "_" como "_x5F_" y añade sufijos
     * como "_1_" cuando encuentra nombres repetidos.
     */

    function normalizeIllustratorName(value) {
      return String(value || "")
        .replace(/_x5f_/gi, "_")
        .replace(/_\d+_?$/g, "")
        .replace(/\s+/g, "_")
        .toLowerCase();
    }

    const NAME_ATTRIBUTES = [
      "id", "data-name", "data-layer", "data-label",
      "aria-label", "inkscape:label", "label", "name"
    ];

    function elementNames(element) {
      return NAME_ATTRIBUTES
        .map(attribute => element.getAttribute?.(attribute))
        .filter(Boolean)
        .map(normalizeIllustratorName);
    }

    function findLayer(root, requestedName) {
      if (!root) return null;
      const wanted = normalizeIllustratorName(requestedName);
      const nodes = [];
      if (root.nodeType === 1) nodes.push(root);
      nodes.push(...root.querySelectorAll("*"));

      // Exacta normalizada primero.
      let found = nodes.find(element => elementNames(element).includes(wanted));
      if (found) return found;

      // Después coincidencia por inclusión, tolerando prefijos/sufijos exportados.
      found = nodes.find(element =>
        elementNames(element).some(name =>
          name.includes(wanted) || wanted.includes(name)
        )
      );
      return found || null;
    }

    function findLayerInElements(svg, requestedName) {
      const elementsLayer = findLayer(svg, "elementos");
      return (elementsLayer && findLayer(elementsLayer, requestedName)) ||
             findLayer(svg, requestedName);
    }


    function prepareHitArea(element, label) {
      if (!element) {
        console.warn(`[Caraval] No se encontró "${label}".`);
        return null;
      }

      const styleTarget = node => {
        node.style.setProperty("cursor", "pointer", "important");
        node.style.setProperty("touch-action", "manipulation", "important");
        node.style.setProperty("-webkit-tap-highlight-color", "transparent", "important");
        node.style.setProperty("pointer-events", "all", "important");
      };

      styleTarget(element);
      element.classList.add("game-hit-target");
      element.style.setProperty("transition", "translate 240ms cubic-bezier(0.22, 1, 0.36, 1)", "important");
      element.style.setProperty("will-change", "translate", "important");
      element.setAttribute("tabindex", "0");
      element.setAttribute("role", "button");
      element.setAttribute("aria-label", label);

      element.querySelectorAll("*").forEach(styleTarget);

      // Un rectángulo transparente adicional refuerza el hit target de grupos SVG.
      // No se depende de él: los listeners también están en el grupo y sus hijos.
      if (element.localName === "g" && !element.querySelector(":scope > .__caraval_hit_area")) {
        try {
          const box = element.getBBox();
          if (box.width > 0 && box.height > 0) {
            const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            hit.setAttribute("class", "__caraval_hit_area");
            hit.setAttribute("x", box.x);
            hit.setAttribute("y", box.y);
            hit.setAttribute("width", box.width);
            hit.setAttribute("height", box.height);
            hit.setAttribute("fill", "rgba(0,0,0,0.001)");
            hit.setAttribute("stroke", "none");
            hit.setAttribute("pointer-events", "all");
            styleTarget(hit);
            // Al final del grupo para que no quede tapado por sus propios hijos.
            element.appendChild(hit);
          }
        } catch (error) {
          console.warn(`[Caraval] getBBox no disponible para ${label}; se usan los descendientes.`, error);
        }
      }

      console.log(`[Caraval] Detectado "${label}"`, element);
      return element;
    }

    function bindAction(element, label, action) {
      const target = prepareHitArea(element, label);
      if (!target) return false;

      let lastActivation = 0;
      const activate = event => {
        if (!activeSvg || !target.isConnected || !activeSvg.contains(target)) return;
        const now = Date.now();
        if (now - lastActivation < 500) return;
        lastActivation = now;
        console.log(`[Caraval] ${label} activado mediante ${event.type}`, event.target);
        action(event);
      };

      // Listener click directamente sobre el elemento encontrado.
      target.addEventListener("click", activate);
      target.addEventListener("pointerup", event => {
        event.preventDefault();
        activate(event);
      }, { passive: false });
      target.addEventListener("touchend", event => {
        // Respaldo Safari antiguo; evita que el gesto se convierta en scroll.
        event.preventDefault();
        activate(event);
      }, { passive: false });

      target.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate(event);
        }
      });

      // En algunos SVG el hit cae en un descendiente con un estilo peculiar.
      // Escuchamos también sus clics, sin duplicar la acción por bubbling.
      target.querySelectorAll("*").forEach(child => {
        child.addEventListener("click", event => {
          if (event.target === child) activate(event);
        });
      });

      return true;
    }

    async function getSvgText(number) {
      if (svgTextCache.has(number)) return svgTextCache.get(number);

      const response = await fetch(fileName(number), { cache: "force-cache" });
      if (!response.ok) {
        throw new Error(`${fileName(number)} respondió con HTTP ${response.status}.`);
      }

      const text = await response.text();
      if (!/<svg[\s>]/i.test(text)) {
        throw new Error(`${fileName(number)} no parece ser un SVG válido.`);
      }

      svgTextCache.set(number, text);
      return text;
    }

    function preloadScreen(number) {
      if (number < 1 || number > TOTAL_SCREENS || svgTextCache.has(number)) return;
      // Carga progresiva: solo se anticipa la pantalla siguiente.
      getSvgText(number).catch(error => console.warn("Precarga omitida:", error));
    }

    function clearAutoTimer() {
      if (autoTimer) clearTimeout(autoTimer);
      autoTimer = null;
    }

    function resetKeyboardControls() {
      keyboardControlLayers.forEach(layer => {
        if (layer?.style) layer.style.translate = "0px 0px";
      });
      answerInput.style.translate = "0px 0px";
      keyboardControlLayers = [];
      keyboardShiftY = 0;
      if (answerInput.style.display !== "none") scheduleInputPosition();
    }

    function hideAnswerInput() {
      answerInput.blur();
      answerInput.style.display = "none";
      answerInput.value = "";
      resetKeyboardControls();
    }

    function setAmbientBackdrop(svgSource) {
      try {
        const blob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
        const nextUrl = URL.createObjectURL(blob);
        ambientBackdrop.style.backgroundImage = `url("${nextUrl}")`;
        if (backdropObjectUrl) URL.revokeObjectURL(backdropObjectUrl);
        backdropObjectUrl = nextUrl;
      } catch (error) {
        console.warn("[Caraval] No se pudo preparar el fondo extendido:", error);
        ambientBackdrop.style.backgroundImage = "none";
      }
    }

    function getScreenNumberFromSvg(svg) {
      return Number(svg?.dataset?.screen || currentScreen);
    }

    function openAnswerField() {
      if (!activeSvg) return;
      const bar = findLayer(activeSvg, "Boton_Barra");
      if (!bar) {
        showStatus("No se encontró la capa Boton_Barra en esta pantalla.");
        return;
      }
      answerInput.style.display = "block";
      answerInput.value = "";
      positionAnswerInput();

      // Enfocar dentro del mismo gesto táctil evita que Safari pierda la
      // activación del usuario y solicita explícitamente no desplazar la página.
      try {
        answerInput.focus({ preventScroll: true });
      } catch (_) {
        answerInput.focus();
      }
      lockDocumentScroll();
      requestAnimationFrame(() => {
        updateKeyboardLayout();
        scheduleInputPosition();
      });
      setTimeout(() => {
        updateKeyboardLayout();
        scheduleInputPosition();
        lockDocumentScroll();
      }, 120);
    }

    function getSvgLayerRect(element) {
      const rect = element.getBoundingClientRect();
      return {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height
      };
    }

    function updateKeyboardLayout() {
      if (!activeSvg || currentScreen < 5 || currentScreen > 10 || answerInput.style.display === "none") {
        resetKeyboardControls();
        return;
      }

      const viewport = window.visualViewport;
      if (!viewport) return;

      const bar = findLayer(activeSvg, "Boton_Barra");
      const send = findLayer(activeSvg, "Boton_Enviar");
      if (!bar || !send) return;

      keyboardControlLayers = [bar, send];

      // Altura real del teclado/área no visible en coordenadas del viewport
      // de layout. offsetTop contempla el desplazamiento del visual viewport.
      const visibleTop = viewport.offsetTop || 0;
      const visibleBottom = visibleTop + viewport.height;
      const keyboardHeight = Math.max(0, window.innerHeight - visibleBottom);
      const keyboardOpen = keyboardHeight > 90;

      if (!keyboardOpen) {
        keyboardControlLayers.forEach(layer => { layer.style.translate = "0px 0px"; });
        answerInput.style.translate = "0px 0px";
        keyboardShiftY = 0;
        scheduleInputPosition();
        return;
      }

      const barRect = getSvgLayerRect(bar);
      const sendRect = getSvgLayerRect(send);
      // Compensa el desplazamiento ya aplicado para obtener el borde original
      // y evitar que cada evento resize acumule más movimiento.
      const lowestControlEdge = Math.max(barRect.bottom, sendRect.bottom) - keyboardShiftY;
      const safeGap = 16;
      const keyboardTop = visibleBottom;
      const shiftY = Math.min(0, keyboardTop - safeGap - lowestControlEdge);

      keyboardShiftY = shiftY;
      keyboardControlLayers.forEach(layer => {
        layer.style.translate = `0px ${shiftY}px`;
      });
      answerInput.style.translate = `0px ${shiftY}px`;

      // El input comparte exactamente el mismo desplazamiento que Boton_Barra.
      scheduleInputPosition();
    }

    function positionAnswerInput() {
      if (!activeSvg || answerInput.style.display === "none") return;

      const bar = findLayer(activeSvg, "Boton_Barra");
      if (!bar) return;

      try {
        const barRect = getSvgLayerRect(bar);
        const stageRect = stage.getBoundingClientRect();
        if (!stageRect.width || !stageRect.height) return;

        // Medición en píxeles CSS del elemento ya renderizado, incluyendo translate.
        const padding = 1;
        const left = Math.max(0, Math.min(stageRect.width - 30, barRect.left - stageRect.left + padding));
        const top = Math.max(0, barRect.top - stageRect.top - keyboardShiftY + padding);
        const width = Math.max(30, Math.min(stageRect.width - left, barRect.width - padding * 2));
        const height = Math.max(28, barRect.height - padding * 2);

        answerInput.style.left = `${left}px`;
        answerInput.style.top = `${top}px`;
        answerInput.style.width = `${width}px`;
        answerInput.style.height = `${height}px`;
        answerInput.style.fontSize = "16px";
      } catch (error) {
        console.warn("No se pudo calcular la posición del campo:", error);
      }
    }

    function scheduleInputPosition() {
      cancelAnimationFrame(inputPositionFrame);
      inputPositionFrame = requestAnimationFrame(positionAnswerInput);
    }

    function submitAnswer() {
      if (!activeSvg) return;
      const screen = getScreenNumberFromSvg(activeSvg);
      const expected = EXPECTED_LETTERS.get(screen);
      if (!expected) return;

      const answer = answerInput.value.trim().toUpperCase();
      if (answer === expected) {
        hideAnswerInput();
        goToScreen(screen + 1);
      } else {
        stage.classList.remove("shake");
        // Reinicia la animación para que también funcione en intentos consecutivos.
        void stage.offsetWidth;
        stage.classList.add("shake");
        answerInput.focus({ preventScroll: true });
        answerInput.select();
        showStatus("Esa no es la letra. Inténtalo otra vez.");
      }
    }

    function configureScreen(svg, number) {
      const found = [];
      const missing = [];

      if ([3, 4, 13].includes(number)) {
        let nextButton = number === 3
          ? (findLayerInElements(svg, "Simbolo_Caraval") || findLayer(svg, "Boton_Siguiente"))
          : findLayer(svg, "Boton_Siguiente");

        const name = number === 3 && normalizeIllustratorName(
          nextButton?.getAttribute("id") || nextButton?.getAttribute("data-name") || ""
        ).includes("simbolo_caraval")
          ? "Simbolo_Caraval"
          : "Boton_Siguiente";

        if (bindAction(nextButton, `${name}_Pantalla_${number}`, () => goToScreen(number + 1))) {
          found.push(name);
        } else {
          missing.push("Boton_Siguiente / Simbolo_Caraval");
        }
      }

      if (number >= 5 && number <= 10) {
        const bar = findLayer(svg, "Boton_Barra");
        const send = findLayer(svg, "Boton_Enviar");
        if (bindAction(bar, `Boton_Barra_Pantalla_${number}`, openAnswerField)) found.push("Boton_Barra");
        else missing.push("Boton_Barra");
        if (bindAction(send, `Boton_Enviar_Pantalla_${number}`, submitAnswer)) found.push("Boton_Enviar");
        else missing.push("Boton_Enviar");
      }

    }

    async function goToScreen(number, options = {}) {
      if (number < 1 || number > TOTAL_SCREENS || navigationLock) return;
      navigationLock = true;
      clearAutoTimer();
      hideAnswerInput();

      try {
        const oldSvg = activeSvg;
        const seamlessTransition = currentScreen === 2 && number === 3;

        // Carga y prepara el nuevo SVG antes de retirar el anterior: evita
        // cualquier frame vacío si la lectura del archivo tarda.
        const source = await getSvgText(number);
        const parsed = new DOMParser().parseFromString(source, "image/svg+xml");
        const parseError = parsed.querySelector("parsererror");
        const svg = parsed.documentElement;

        if (parseError || !svg || svg.localName !== "svg") {
          throw new Error(`${fileName(number)} contiene XML no válido.`);
        }

        const importedSvg = document.importNode(svg, true);
        importedSvg.setAttribute(
          "preserveAspectRatio",
          importedSvg.getAttribute("preserveAspectRatio") || "xMidYMid meet"
        );
        importedSvg.classList.add("is-active");
        importedSvg.style.setProperty("display", "block", "important");
        importedSvg.style.setProperty("pointer-events", "auto", "important");
        importedSvg.style.setProperty("z-index", "11", "important");

        if (!seamlessTransition && oldSvg) {
          importedSvg.classList.add("is-entering");
        }

        // La pantalla nueva se monta encima de la anterior. Ambas opacidades
        // cambian juntas para producir un crossfade sin fondo oscuro intermedio.
        stage.appendChild(importedSvg);

        if (oldSvg) {
          oldSvg.style.setProperty("pointer-events", "none", "important");
          if (seamlessTransition) {
            oldSvg.remove();
          } else {
            oldSvg.classList.add("is-leaving");
          }
        }

        activeSvg = importedSvg;
        currentScreen = number;
        stage.style.setProperty("pointer-events", "auto", "important");

        importedSvg.querySelectorAll("image").forEach(imageElement => {
          imageElement.style.setProperty("pointer-events", "none", "important");
        });

        configureScreen(importedSvg, number);
        setAmbientBackdrop(source);

        void importedSvg.getBoundingClientRect();

        const transitionDuration = seamlessTransition
          ? 0
          : ((number === 11 && oldSvg && oldSvg.dataset.screen === "10") ? 1100 : 950);

        if (!seamlessTransition && oldSvg) {
          requestAnimationFrame(() => {
            importedSvg.classList.remove("is-entering");
          });
          await new Promise(resolve => setTimeout(resolve, transitionDuration));
          oldSvg.remove();
        } else {
          importedSvg.classList.remove("is-entering");
        }

        preloadScreen(number + 1);
        scheduleInputPosition();

        const delay = AUTO_ADVANCE.get(number);
        if (delay) {
          autoTimer = setTimeout(() => goToScreen(number + 1), delay);
        }
      } catch (error) {
        console.error(error);
        showError(
          location.protocol === "file:"
            ? "El navegador bloqueó la lectura de los SVG porque abriste el HTML con file://. Usa un servidor local (instrucciones abajo)."
            : `No se pudo abrir ${fileName(number)}. ${error.message}`
        );
      } finally {
        navigationLock = false;
      }
    }

    // Enter/Done en el teclado equivale a pulsar Enviar.
    answerInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitAnswer();
      }
    });

    answerInput.addEventListener("focus", () => {
      lockDocumentScroll();
      requestAnimationFrame(() => {
        lockDocumentScroll();
        updateKeyboardLayout();
      });
    });

    answerInput.addEventListener("blur", () => {
      resetKeyboardControls();
    });

    window.addEventListener("scroll", lockDocumentScroll, { passive: true });
    document.addEventListener("scroll", lockDocumentScroll, { passive: true, capture: true });

    // Mantiene el campo alineado con la barra cuando cambia el viewport móvil.
    window.addEventListener("resize", () => {
      if (answerInput.style.display !== "none") updateKeyboardLayout();
      scheduleInputPosition();
    }, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(() => {
      if (answerInput.style.display !== "none") {
        updateKeyboardLayout();
      } else {
        document.documentElement.style.setProperty("--layout-height", `${window.innerHeight}px`);
      }
      scheduleInputPosition();
    }, 250), { passive: true });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        // El escenario permanece fijo: solo se reposicionan la barra, el botón
        // de envío y el input por encima del teclado virtual.
        if (answerInput.style.display !== "none") updateKeyboardLayout();
        scheduleInputPosition();
      }, { passive: true });

      window.visualViewport.addEventListener("scroll", () => {
        lockDocumentScroll();
        if (answerInput.style.display !== "none") updateKeyboardLayout();
        scheduleInputPosition();
      }, { passive: true });
    }

    stage.addEventListener("animationend", event => {
      if (event.animationName === "gentle-shake") stage.classList.remove("shake");
    });

    retryButton.addEventListener("click", () => {
      hideError();
      goToScreen(currentScreen || 1);
    });

    // file:// normalmente impide fetch() de archivos locales por seguridad.
    if (location.protocol === "file:") {
      showError("Has abierto el archivo directamente (file://). Para cargar SVG externos como SVG inline, inicia un servidor local. No es un error de tus ilustraciones.");
    } else {
      goToScreen(1);
    }
  })();
  </script>
</body>
</html>
