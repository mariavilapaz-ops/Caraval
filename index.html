<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#100d16">
  <title>Caraval — Juego interactivo</title>
  <style>
    :root {
      color-scheme: dark;
      --app-bg: #100d16;
      --fade-ms: 320ms;
      --visual-height: 100dvh;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--app-bg);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #game-shell {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: var(--visual-height);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--app-bg);
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
    }

    /* 9:16: el arte nunca se recorta ni se deforma. */
    #stage {
      position: relative;
      width: min(100vw, calc(var(--visual-height) * 0.5625));
      height: min(var(--visual-height), calc(100vw * 1.77777778));
      aspect-ratio: 9 / 16;
      flex: 0 0 auto;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    #stage > svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      /* No se aplican resets gráficos a los elementos internos del SVG. */
      transition: opacity var(--fade-ms) ease;
      opacity: 1;
    }

    #stage > svg.is-active {
      z-index: 2;
      pointer-events: auto;
    }

    #stage > svg.is-entering { opacity: 0; pointer-events: none; }
    #stage > svg.is-leaving { opacity: 0; pointer-events: none; }

    /* Las imágenes incrustadas son arte de fondo, nunca controles. */
    #stage > svg image {
      pointer-events: none !important;
    }

    .game-hit-target {
      cursor: pointer !important;
      touch-action: manipulation;
    }

    #answer-input {
      position: absolute;
      z-index: 20;
      display: none;
      margin: 0;
      padding: 0 5px;
      border: 0;
      border-radius: 3px;
      outline: none;
      background: rgba(255,255,255,.04);
      color: #24172a;
      caret-color: #24172a;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #answer-input:focus {
      background: rgba(255,255,255,.12);
    }

    #status-message {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: min(92vw, 420px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(20, 15, 27, .88);
      color: #fff;
      font: 500 13px/1.35 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #status-message.visible { opacity: 1; }

    #error-panel {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #100d16;
      color: #fff;
      text-align: center;
    }

    #error-panel.visible { display: flex; }

    #error-panel section {
      width: min(100%, 520px);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    #error-panel h1 {
      margin: 0 0 12px;
      font: 600 22px/1.2 Georgia, serif;
    }

    #error-panel p {
      margin: 10px 0;
      color: rgba(255,255,255,.82);
      font: 14px/1.55 system-ui, sans-serif;
    }

    #error-panel code {
      color: #f1d8aa;
      overflow-wrap: anywhere;
    }

    #retry-button {
      margin-top: 12px;
      padding: 11px 18px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: transparent;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .shake {
      animation: gentle-shake 360ms ease-in-out;
    }

    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-5px); }
      36% { transform: translateX(5px); }
      54% { transform: translateX(-3px); }
      72% { transform: translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #stage > svg, #status-message { transition-duration: 1ms; }
      .shake { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Juego interactivo">
    <div id="stage" aria-live="off"></div>
    <input
      id="answer-input"
      type="text"
      inputmode="text"
      enterkeyhint="done"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      maxlength="12"
      aria-label="Escribe la letra de la pista"
    >
  </main>

  <div id="status-message" role="status" aria-live="polite"></div>

  <div id="error-panel" role="alert">
    <section>
      <h1>No se pudieron cargar las pantallas</h1>
      <p id="error-description"></p>
      <p>Comprueba que <code>index.html</code> y los archivos <code>Pantalla_1.svg</code> a <code>Pantalla_14.svg</code> estén en la misma carpeta y abre el juego desde un servidor local.</p>
      <p>Por ejemplo, en esa carpeta ejecuta <code>python3 -m http.server 8000</code> y visita <code>http://localhost:8000</code>.</p>
      <button id="retry-button" type="button">Volver a intentar</button>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const TOTAL_SCREENS = 14;
    const FADE_MS = 320;
    const AUTO_ADVANCE = new Map([
      [1, 2000],
      [2, 2000],
      [11, 2000],
      [12, 3000]
    ]);
    const EXPECTED_LETTERS = new Map([
      [5, "L"],
      [6, "E"],
      [7, "G"],
      [8, "E"],
      [9, "N"],
      [10, "D"]
    ]);

    const stage = document.getElementById("stage");
    const shell = document.getElementById("game-shell");
    const answerInput = document.getElementById("answer-input");
    const statusMessage = document.getElementById("status-message");
    const errorPanel = document.getElementById("error-panel");
    const errorDescription = document.getElementById("error-description");
    const retryButton = document.getElementById("retry-button");

    const svgTextCache = new Map();
    let currentScreen = 0;
    let autoTimer = null;
    let statusTimer = null;
    let inputPositionFrame = 0;
    let lastPointerAction = 0;
    let navigationLock = false;
    let activeSvg = null;

    function fileName(number) {
      return `Pantalla_${number}.svg`;
    }

    function showError(message) {
      errorDescription.textContent = message;
      errorPanel.classList.add("visible");
    }

    function hideError() {
      errorPanel.classList.remove("visible");
    }

    function showStatus(message, duration = 1400) {
      statusMessage.textContent = message;
      statusMessage.classList.add("visible");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => statusMessage.classList.remove("visible"), duration);
    }

    /*
     * Illustrator suele codificar "_" como "_x5F_" y añade sufijos
     * como "_1_" cuando encuentra nombres repetidos.
     */
    function normalizeIllustratorName(value) {
      return String(value || "")
        .replace(/_x([0-9a-fA-F]{4})_/g, (_, hex) =>
          String.fromCharCode(parseInt(hex, 16)))
        .replace(/_\d+_?$/, "")
        .replace(/[\s-]+/g, "_")
        .toLowerCase();
    }

    function findLayer(root, requestedName) {
      if (!root) return null;
      const wanted = normalizeIllustratorName(requestedName);
      const candidates = [];
      if (root.nodeType === 1 && (root.hasAttribute("id") || root.hasAttribute("data-name"))) {
        candidates.push(root);
      }
      candidates.push(...root.querySelectorAll("[id], [data-name]"));

      const getNames = element => [
        normalizeIllustratorName(element.getAttribute("id")),
        normalizeIllustratorName(element.getAttribute("data-name"))
      ].filter(Boolean);

      // Primero coincidencia exacta; después sufijos típicos añadidos por Illustrator.
      const exact = candidates.find(element => getNames(element).includes(wanted));
      if (exact) return exact;

      return candidates.find(element =>
        getNames(element).some(name =>
          name.startsWith(wanted + "_") || name.startsWith(wanted)
        )
      ) || null;
    }

    function findLayerInElements(svg, layerName) {
      const elementsLayer = findLayer(svg, "elementos");
      return (elementsLayer && findLayer(elementsLayer, layerName)) ||
             findLayer(svg, layerName);
    }

    function prepareHitArea(element, label) {
      if (!element) {
        console.warn(`[Caraval] No se encontró la capa interactiva "${label}".`);
        return null;
      }

      element.classList.add("game-hit-target");
      element.style.setProperty("cursor", "pointer", "important");
      element.style.setProperty("pointer-events", "all", "important");
      element.setAttribute("tabindex", "0");
      element.setAttribute("role", "button");
      element.setAttribute("aria-label", label);

      // En grupos <g>, pointer-events:bounding-box no es consistente en todos
      // los Safari móviles. Un rectángulo transparente dentro del grupo crea
      // un área táctil real sin modificar la apariencia del arte.
      if (element.localName === "g" && !element.querySelector(":scope > .__caraval_hit_area")) {
        try {
          const box = element.getBBox();
          if (box.width > 0 && box.height > 0) {
            const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            hit.setAttribute("class", "__caraval_hit_area");
            hit.setAttribute("x", box.x);
            hit.setAttribute("y", box.y);
            hit.setAttribute("width", box.width);
            hit.setAttribute("height", box.height);
            hit.setAttribute("fill", "transparent");
            hit.setAttribute("fill-opacity", "0");
            hit.setAttribute("stroke", "none");
            hit.setAttribute("pointer-events", "all");
            hit.style.setProperty("pointer-events", "all", "important");
            element.insertBefore(hit, element.firstChild);
          }
        } catch (error) {
          console.warn(`[Caraval] No se pudo crear el área táctil de ${label}:`, error);
        }
      }

      // Los descendientes del grupo también deben aceptar el puntero.
      element.querySelectorAll("*").forEach(child => {
        child.style.setProperty("pointer-events", "all", "important");
      });

      console.log(`[Caraval] Botón detectado: ${label}`, element);
      return element;
    }

    function bindAction(element, label, action) {
      const target = prepareHitArea(element, label);
      if (!target) return;

      let lastActivation = 0;
      const activate = event => {
        const now = Date.now();
        if (now - lastActivation < 450) return;
        lastActivation = now;
        console.log(`[Caraval] ${label}: activado por ${event.type}`, event);
        action(event);
      };

      target.addEventListener("pointerdown", event => {
        console.log(`[Caraval] ${label}: pointerdown (${event.pointerType || "unknown"})`);
        if (event.pointerType === "mouse" && event.button !== 0) return;
      }, { passive: true });

      target.addEventListener("pointerup", event => {
        event.preventDefault();
        activate(event);
      }, { passive: false });

      // Respaldo para entornos sin Pointer Events y activación accesible.
      target.addEventListener("click", event => {
        if (Date.now() - lastActivation < 450) return;
        activate(event);
      });

      target.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate(event);
        }
      });
    }

    async function getSvgText(number) {
      if (svgTextCache.has(number)) return svgTextCache.get(number);

      const response = await fetch(fileName(number), { cache: "force-cache" });
      if (!response.ok) {
        throw new Error(`${fileName(number)} respondió con HTTP ${response.status}.`);
      }

      const text = await response.text();
      if (!/<svg[\s>]/i.test(text)) {
        throw new Error(`${fileName(number)} no parece ser un SVG válido.`);
      }

      svgTextCache.set(number, text);
      return text;
    }

    function preloadScreen(number) {
      if (number < 1 || number > TOTAL_SCREENS || svgTextCache.has(number)) return;
      // Carga progresiva: solo se anticipa la pantalla siguiente.
      getSvgText(number).catch(error => console.warn("Precarga omitida:", error));
    }

    function clearAutoTimer() {
      if (autoTimer) clearTimeout(autoTimer);
      autoTimer = null;
    }

    function hideAnswerInput() {
      answerInput.blur();
      answerInput.style.display = "none";
      answerInput.value = "";
    }

    function setInteractiveStyle(element) {
      if (!element) return;
      element.classList.add("game-hit-target");
      element.style.setProperty("cursor", "pointer", "important");
      element.style.setProperty("pointer-events", "auto", "important");
      element.setAttribute("tabindex", "0");
      element.setAttribute("role", "button");
    }

    function bindAction(element, action) {
      if (!element) return;
      setInteractiveStyle(element);

      const run = event => {
        if (event.type === "pointerdown") {
          lastPointerAction = Date.now();
          if (event.pointerType === "mouse" && event.button !== 0) return;
          event.preventDefault();
          action(event);
          return;
        }
        // Respaldo para navegadores sin Pointer Events. Evita doble activación.
        if (event.type === "click") {
          if (Date.now() - lastPointerAction < 650) return;
          action(event);
        }
      };

      element.addEventListener("pointerdown", run, { passive: false });
      element.addEventListener("click", run);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          action(event);
        }
      });
    }

    function getScreenNumberFromSvg(svg) {
      return Number(svg?.dataset?.screen || currentScreen);
    }

    function openAnswerField() {
      if (!activeSvg) return;
      const bar = findLayer(activeSvg, "Boton_Barra");
      if (!bar) {
        showStatus("No se encontró la capa Boton_Barra en esta pantalla.");
        return;
      }
      answerInput.style.display = "block";
      answerInput.value = "";
      positionAnswerInput();
      // Un pequeño retraso ayuda a Safari móvil a abrir el teclado tras el gesto.
      requestAnimationFrame(() => answerInput.focus({ preventScroll: true }));
    }

    function positionAnswerInput() {
      if (!activeSvg || answerInput.style.display === "none") return;

      const bar = findLayer(activeSvg, "Boton_Barra");
      if (!bar || typeof bar.getBBox !== "function") return;

      try {
        const box = bar.getBBox();
        const matrix = bar.getScreenCTM();
        const stageRect = stage.getBoundingClientRect();
        if (!matrix || !stageRect.width || !stageRect.height) return;

        const points = [
          new DOMPoint(box.x, box.y).matrixTransform(matrix),
          new DOMPoint(box.x + box.width, box.y).matrixTransform(matrix),
          new DOMPoint(box.x, box.y + box.height).matrixTransform(matrix),
          new DOMPoint(box.x + box.width, box.y + box.height).matrixTransform(matrix)
        ];

        const left = Math.min(...points.map(point => point.x)) - stageRect.left;
        const top = Math.min(...points.map(point => point.y)) - stageRect.top;
        const right = Math.max(...points.map(point => point.x)) - stageRect.left;
        const bottom = Math.max(...points.map(point => point.y)) - stageRect.top;

        answerInput.style.left = `${left}px`;
        answerInput.style.top = `${top}px`;
        answerInput.style.width = `${Math.max(30, right - left)}px`;
        answerInput.style.height = `${Math.max(28, bottom - top)}px`;
        answerInput.style.fontSize = `${Math.max(18, Math.min(42, (bottom - top) * 0.55))}px`;
      } catch (error) {
        console.warn("No se pudo calcular la posición del campo:", error);
      }
    }

    function scheduleInputPosition() {
      cancelAnimationFrame(inputPositionFrame);
      inputPositionFrame = requestAnimationFrame(positionAnswerInput);
    }

    function submitAnswer() {
      if (!activeSvg) return;
      const screen = getScreenNumberFromSvg(activeSvg);
      const expected = EXPECTED_LETTERS.get(screen);
      if (!expected) return;

      const answer = answerInput.value.trim().toUpperCase();
      if (answer === expected) {
        hideAnswerInput();
        goToScreen(screen + 1);
      } else {
        stage.classList.remove("shake");
        // Reinicia la animación para que también funcione en intentos consecutivos.
        void stage.offsetWidth;
        stage.classList.add("shake");
        answerInput.focus({ preventScroll: true });
        answerInput.select();
        showStatus("Esa no es la letra. Inténtalo otra vez.");
      }
    }

    function configureScreen(svg, number) {
      svg.dataset.screen = String(number);

      if (number === 3 || number === 4 || number === 13) {
        let nextButton = null;

        if (number === 3) {
          // El símbolo pertenece a "elementos" cuando Illustrator lo exporta así.
          // Si esta pantalla contiene el botón ya renombrado, se prioriza el símbolo.
          const caravalSymbol = findLayerInElements(svg, "Simbolo_Caraval");
          nextButton = caravalSymbol || findLayer(svg, "Boton_Siguiente");
          if (!caravalSymbol) {
            console.log("[Caraval] Pantalla 3: no hay Simbolo_Caraval; se usa Boton_Siguiente.");
          }
        } else {
          nextButton = findLayer(svg, "Boton_Siguiente");
        }

        bindAction(nextButton, `Boton_Siguiente_Pantalla_${number}`, () => goToScreen(number + 1));
      }

      if (number >= 5 && number <= 10) {
        const bar = findLayer(svg, "Boton_Barra");
        const send = findLayer(svg, "Boton_Enviar");
        bindAction(bar, `Boton_Barra_Pantalla_${number}`, openAnswerField);
        bindAction(send, `Boton_Enviar_Pantalla_${number}`, submitAnswer);
      }
    }

    async function goToScreen(number, options = {}) {
      if (number < 1 || number > TOTAL_SCREENS || navigationLock) return;
      navigationLock = true;
      clearAutoTimer();
      hideAnswerInput();

      try {
        const oldSvg = activeSvg;
        const seamlessTransition = currentScreen === 2 && number === 3;

        if (oldSvg) {
          oldSvg.classList.remove("is-active");
          oldSvg.style.pointerEvents = "none";
          if (!seamlessTransition) {
            oldSvg.classList.add("is-leaving");
            await new Promise(resolve => setTimeout(resolve, FADE_MS));
          }
        }

        const source = await getSvgText(number);
        const parsed = new DOMParser().parseFromString(source, "image/svg+xml");
        const parseError = parsed.querySelector("parsererror");
        const svg = parsed.documentElement;

        if (parseError || !svg || svg.localName !== "svg") {
          throw new Error(`${fileName(number)} contiene XML no válido.`);
        }

        const importedSvg = document.importNode(svg, true);
        importedSvg.setAttribute("preserveAspectRatio", importedSvg.getAttribute("preserveAspectRatio") || "xMidYMid meet");
        importedSvg.classList.add("is-active");

        if (!seamlessTransition) importedSvg.classList.add("is-entering");

        stage.replaceChildren(importedSvg);
        activeSvg = importedSvg;
        currentScreen = number;

        configureScreen(importedSvg, number);

        // La transición 2 -> 3 es inmediata, sin fade: continuidad visual.
        // El resto entra con fade suave.
        void importedSvg.getBoundingClientRect();
        if (!seamlessTransition) {
          requestAnimationFrame(() => importedSvg.classList.remove("is-entering"));
        }

        preloadScreen(number + 1);
        scheduleInputPosition();

        const delay = AUTO_ADVANCE.get(number);
        if (delay) {
          autoTimer = setTimeout(() => goToScreen(number + 1), delay);
        }
      } catch (error) {
        console.error(error);
        showError(
          location.protocol === "file:"
            ? "El navegador bloqueó la lectura de los SVG porque abriste el HTML con file://. Usa un servidor local (instrucciones abajo)."
            : `No se pudo abrir ${fileName(number)}. ${error.message}`
        );
      } finally {
        navigationLock = false;
      }
    }

    // Enter/Done en el teclado equivale a pulsar Enviar.
    answerInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitAnswer();
      }
    });

    // Mantiene el campo alineado con la barra cuando cambia el viewport móvil.
    window.addEventListener("resize", scheduleInputPosition, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(scheduleInputPosition, 250), { passive: true });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        const viewport = window.visualViewport;
        document.documentElement.style.setProperty("--visual-height", `${viewport.height}px`);
        shell.style.top = `${viewport.offsetTop}px`;
        scheduleInputPosition();
      }, { passive: true });

      window.visualViewport.addEventListener("scroll", () => {
        shell.style.top = `${window.visualViewport.offsetTop}px`;
        scheduleInputPosition();
      }, { passive: true });
    }

    stage.addEventListener("animationend", event => {
      if (event.animationName === "gentle-shake") stage.classList.remove("shake");
    });

    retryButton.addEventListener("click", () => {
      hideError();
      goToScreen(currentScreen || 1);
    });

    // file:// normalmente impide fetch() de archivos locales por seguridad.
    if (location.protocol === "file:") {
      showError("Has abierto el archivo directamente (file://). Para cargar SVG externos como SVG inline, inicia un servidor local. No es un error de tus ilustraciones.");
    } else {
      goToScreen(1);
    }
  })();
  </script>
</body>
</html>
